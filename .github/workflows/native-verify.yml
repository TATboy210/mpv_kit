# Verify tier: compile the patched libmpv on every target with system/distro
# dependencies, run the render_vk smoke test, the ABI audit and the Dart core
# tests. Distro FFmpeg builds are often GPL, so these artifacts are for
# verification only; redistributable LGPL binaries come from release.yml.
name: native-verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MESON_ARGS: >-
    -Dlibmpv=true -Dcplayer=false -Dgpl=false
    -Dvulkan=enabled -Dlua=disabled -Djavascript=disabled
    -Drubberband=disabled -Dtests=false
    -Damf=disabled -Ddvda=disabled -Dlibcurl=disabled -Dsubrandr=disabled
    --buildtype=release -Db_lundef=true

jobs:
  # BUILD-01: prove vendor == base(MPV_VERSION) + patches before anything
  # else trusts the vendored tree.
  patch-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Patch drift check
        run: bash tools/check_patches.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc cmake nasm python3-jinja2 curl xz-utils \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libass-dev libvulkan-dev libegl-dev libgl-dev \
            libdrm-dev libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools zlib1g-dev
        # No libplacebo-dev: the 24.04 distro ships 6.338, but mpv master
        # needs >=7.360.1 — build the pinned stack with deps.sh instead.
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-verify-linux-${{ matrix.runner }}-${{ hashFiles('native/build/deps.sh') }}
      - name: Build libplacebo stack (deps.sh)
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build libmpv
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
        run: |
          meson setup out native/mpv $MESON_ARGS --prefix="$PWD/prefix" --libdir=lib
          meson compile -C out
          meson install -C out
          grep -E "vulkan|gl " out/config.h | head -20 || true
      - name: ABI audit
        run: |
          nm -D --defined-only prefix/lib/libmpv.so.2 | awk '{print $3}' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
      - name: render_vk smoke test (lavapipe)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig:${{ github.workspace }}/deps/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib:${{ github.workspace }}/deps/lib
        run: |
          vulkaninfo --summary || true
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs --verbose || { cat tests-out/meson-logs/testlog.txt; exit 1; }
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests (mpv_kit, mpv_kit_libs)
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/prefix/lib/libmpv.so.2
          # libmpv.so dlopens the deps.sh-built libplacebo/dav1d at load time.
          LD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib:${{ github.workspace }}/deps/lib
        run: |
          # Dart-only resolve: drop Flutter members (no Flutter SDK on every runner).
          sed -i.bak -e "/mpv_kit_video/d" -e "/example/d" pubspec.yaml && rm -rf example packages/mpv_kit_video
          dart pub get
          dart pub global activate coverage
          cd packages/mpv_kit && dart analyze --fatal-infos
          dart pub global run coverage:test_with_coverage
          awk -F: '/^LF:/{a+=$2} /^LH:/{b+=$2} END{printf "::notice::mpv_kit line coverage %.1f%% (%d/%d)\n",100*b/a,b,a; if (100*b/a < 80) exit 1}' coverage/lcov.info
          # BUILD-02: the committed bundle pins must match the live release.
          dart run ../../tools/pin_bundles.dart --check
          # The `lifecycle` tag is skipped by default in dart_test.yaml, so the
          # concurrent coverage run above never executes the soak. The explicit
          # file-scoped invocation below loads only lifecycle_test.dart, so no
          # other suite's tests execute in that invocation and the process-wide
          # RSS delta contains no other suite's allocations.
          #
          # `--run-skipped` is load-bearing: without it the same invocation
          # reports "All tests skipped" and still exits 0, so dropping the flag
          # would leave this job green with zero soak cycles. Only a missing or
          # uncollected suite exits non-zero.
          dart test -t failure-injection
          dart test test/lifecycle_test.dart -t lifecycle --run-skipped
          cd ../mpv_kit_libs && dart analyze --fatal-infos
          dart pub global run coverage:test_with_coverage
          awk -F: '/^LF:/{a+=$2} /^LH:/{b+=$2} END{printf "::notice::mpv_kit_libs line coverage %.1f%% (%d/%d)\n",100*b/a,b,a; if (100*b/a < 80) exit 1}' coverage/lcov.info

      # The Flutter coverage job consumes this artifact instead of rebuilding
      # libmpv: one build, one provenance (BUILD-01 direction). deps/lib is
      # included because libmpv.so.2 dlopens the deps.sh-built libplacebo and
      # dav1d from it at load time.
      - name: Stage libmpv for the Flutter coverage job
        run: |
          mkdir -p stage/lib stage/deps
          cp -r prefix/lib/. stage/lib/
          cp -r deps/lib/. stage/deps/
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-verify-linux-${{ matrix.runner }}
          path: stage
          retention-days: 14

  # VERIFY-04: line-coverage gate for mpv_kit_video. Its channel tests are
  # skip-guarded on a real libmpv, so the job downloads the linux job's build
  # instead of running them skipped; below 80% the job fails.
  flutter-video-coverage:
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # libmpv.so.2 resolves its FFmpeg/libass/Vulkan/EGL dependencies from
      # the distro; the -dev packages carry the same runtime .so ABI the
      # linux job builds against.
      - name: Install libmpv runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libass-dev libvulkan-dev libegl-dev libgl-dev \
            libdrm-dev libx11-dev libwayland-dev libxkbcommon-dev zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-verify-linux-ubuntu-24.04
          path: stage
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: mpv_kit_video coverage gate (80%)
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/stage/lib/libmpv.so.2
          LD_LIBRARY_PATH: ${{ github.workspace }}/stage/lib:${{ github.workspace }}/stage/deps
        run: |
          cd packages/mpv_kit_video
          flutter test --coverage
          flutter analyze --fatal-infos
          awk -F: '/^LF:/{a+=$2} /^LH:/{b+=$2} END{printf "::notice::mpv_kit_video line coverage %.1f%% (%d/%d)\n",100*b/a,b,a; if (100*b/a < 80) exit 1}' coverage/lcov.info

  # ASan + UBSan: debug libmpv (our patches and the stream bridge included)
  # driven by the native tests. Tests are built with the same sanitizers so
  # the runtime is loaded first. Leak checking is off (system libraries such
  # as Mesa keep process-lifetime allocations); any other report fails.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        # No libplacebo-dev: the 24.04 distro ships 6.338, but mpv master
        # needs >=7.360.1 — build the pinned stack with deps.sh instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             meson ninja-build pkg-config gcc cmake nasm python3-jinja2 curl xz-utils             libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev             libavdevice-dev libswscale-dev libswresample-dev             libass-dev libvulkan-dev libegl-dev libgl-dev             libdrm-dev libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev             mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-verify-linux-ubuntu-24.04-${{ hashFiles('native/build/deps.sh') }}
      - name: Build libplacebo stack (deps.sh)
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build libmpv (debug, ASan + UBSan)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
        run: |
          meson setup out native/mpv             -Dlibmpv=true -Dcplayer=false -Dgpl=false             -Dvulkan=enabled -Dlua=disabled -Djavascript=disabled             -Drubberband=disabled -Dtests=false             --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false             --prefix="$PWD/prefix" --libdir=lib
          meson compile -C out
          meson install -C out
      - name: Native tests under sanitizers (lavapipe)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig:${{ github.workspace }}/deps/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib:${{ github.workspace }}/deps/lib
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          vulkaninfo --summary || true
          meson setup tests-out native/tests --buildtype=debug             -Db_sanitize=address,undefined -Db_lundef=false
          meson test -C tests-out --print-errorlogs --verbose --timeout-multiplier 3             || { cat tests-out/meson-logs/testlog.txt; exit 1; }

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install meson ninja pkgconf ffmpeg libplacebo libass molten-vk vulkan-headers vulkan-loader
      - name: Build libmpv
        run: |
          meson setup out native/mpv $MESON_ARGS -Dswift-build=disabled -Dcocoa=disabled \
            --prefix="$PWD/prefix" --libdir=lib
          meson compile -C out
          meson install -C out
      - name: ABI audit
        run: |
          nm -gU prefix/lib/libmpv.2.dylib | awk '{print $3}' | sed 's/^_//' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
      - name: Vulkan loader diagnostics
        continue-on-error: true
        env:
          VK_LOADER_DEBUG: error,warn,info
        run: |
          brew install vulkan-tools || true
          vulkaninfo --summary 2>&1 | tail -40 || true
      - name: render_vk smoke test (MoltenVK; skipped without Metal)
        # GitHub's Intel macOS VMs expose a paravirtual GPU on which MoltenVK
        # aborts inside vkCreateInstance; real Intel Macs are unaffected.
        continue-on-error: ${{ matrix.runner == 'macos-15-intel' }}
        env:
          MVK_CONFIG_LOG_LEVEL: '2'
          VK_LOADER_DEBUG: error,warn

          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib
        run: |
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs --verbose || { cat tests-out/meson-logs/testlog.txt; exit 1; }
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests (mpv_kit, mpv_kit_libs)
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/prefix/lib/libmpv.2.dylib
        run: |
          # Dart-only resolve: drop Flutter members (no Flutter SDK on every runner).
          sed -i.bak -e "/mpv_kit_video/d" -e "/example/d" pubspec.yaml && rm -rf example packages/mpv_kit_video
          dart pub get
          cd packages/mpv_kit && dart analyze --fatal-infos && dart test
          cd ../mpv_kit_libs && dart analyze --fatal-infos && dart test

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            msystem: CLANG64
            mesa_arch: x64
          - runner: windows-11-arm
            msystem: CLANGARM64
            mesa_arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      # Software Vulkan (lavapipe) so the smoke test renders for real on
      # GPU-less runners. Pinned by sha256.
      - name: Install Mesa lavapipe
        shell: pwsh
        env:
          MESA_VERSION: 26.2.4
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $f = "mesa.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $f
          if ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $env:MESA_SHA256) { throw "mesa sha256 mismatch" }
          7z x $f -omesa | Out-Null
          Get-ChildItem mesa -Directory | ForEach-Object { $_.Name }
          $icd = Get-ChildItem "mesa/${{ matrix.mesa_arch }}" -Filter "lvp_icd.*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($icd) {
            "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          } else {
            # No lavapipe build for this arch: the smoke test will skip (77).
            Write-Output "::warning::no lavapipe for ${{ matrix.mesa_arch }}; render_vk smoke test will be skipped"
          }
      - uses: msys2/setup-msys2@v2
        id: msys2
        continue-on-error: true
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p meson:p ninja:p pkgconf:p ffmpeg:p libplacebo:p
            libass:p vulkan-headers:p vulkan-loader:p shaderc:p spirv-cross:p ntldd:p
      - uses: msys2/setup-msys2@v2
        if: steps.msys2.outcome == 'failure'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p meson:p ninja:p pkgconf:p ffmpeg:p libplacebo:p
            libass:p vulkan-headers:p vulkan-loader:p shaderc:p spirv-cross:p ntldd:p
      - name: Build libmpv
        run: |
          meson setup out native/mpv $MESON_ARGS -Dd3d11=enabled --prefix="$PWD/prefix"
          meson compile -C out
          meson install -C out
      - name: ABI audit
        run: python -I tools/rea_abi_audit/pe_audit.py prefix/bin/libmpv-2.dll --expect tools/rea_abi_audit/expected_symbols.txt
      - name: render_vk smoke test (lavapipe)
        run: |
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig" PATH="$PWD/prefix/bin:$PATH"
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs --verbose || { cat tests-out/meson-logs/testlog.txt; exit 1; }
      - name: Stage DLL closure for Dart tests
        run: |
          mkdir -p stage
          cp prefix/bin/libmpv-2.dll stage/
          # ntldd reads PE imports natively (msys2's ldd is unreliable on arm64).
          ntldd -R prefix/bin/libmpv-2.dll | tr -d '\r' \
            | grep -iE '[\/](clang64|clangarm64)[\/]bin[\/]' \
            | sed -E 's/.*=> (.*) \(0x[0-9a-fA-F]+\)$/\1/' \
            | while read -r dll; do cp "$(cygpath -u "$dll")" stage/; done
          ls stage
          cp -r prefix/include stage/
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-verify-${{ matrix.msystem }}
          path: stage
          retention-days: 14
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests (mpv_kit, mpv_kit_libs)
        shell: pwsh
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}\stage\libmpv-2.dll
        run: |
          $env:PATH = "${{ github.workspace }}\stage;$env:PATH"
          # Dart-only resolve: drop Flutter members (no Flutter SDK on every runner).
          sed -i.bak -e "/mpv_kit_video/d" -e "/example/d" pubspec.yaml
          Remove-Item -Recurse -Force example, packages/mpv_kit_video
          dart pub get
          cd packages/mpv_kit
          dart analyze --fatal-infos
          dart test
          cd ../mpv_kit_libs
          dart analyze --fatal-infos
          dart test
