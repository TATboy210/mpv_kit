# macOS route probe (Phase 13 / ADR 0005, MAC-02): runs the real plugin test
# on a macOS runner against the hook bundle libmpv and reads the pixels.
# The bundle in the app is the libmpv under test (not a verify-tier build);
# the verification tier is an Apple Silicon VM. The test itself asserts the
# loaded library is `@rpath/mpv.2.framework/mpv.2` and prints every attempt
# when it is not. No step may be tolerated when it fails: a red probe is data.
name: macos-route

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  route-probe:
    name: route-probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Milestone v3.0 roadmap commit: the last product tree before Phase 12.
      # Same baseline as the constants audit; the full 40-character SHA is
      # asserted after the worktree is created.
      PRE12_SHA: 3a5f4500f38577e4dcba2023b73c7f4a4b1b3920
    steps:
      - uses: actions/checkout@v5
        with:
          # The pre-Phase-12 comparison (3a5f450) needs history.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Generate route samples
        # Three 640x360 / 30 fps / 4 s samples for the hwdec section, made
        # on the runner and never committed (example/integration_test/
        # route_samples/README.md). The encoders are GPL (x264/x265): they
        # only make test media and never enter the LGPL libmpv bundle.
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg
          ffmpeg -hide_banner -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          # Write to a file first, then take the line: a pipe into `head`
          # can SIGPIPE the writer under pipefail.
          echo "ROUTE-SAMPLES ffmpeg=$(sed -n 1p "$RUNNER_TEMP/ffmpeg-version.txt")"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          for enc in libx264 libx265; do
            if ! grep -q " $enc " "$RUNNER_TEMP/ffmpeg-encoders.txt"; then
              echo "ffmpeg has no $enc encoder; cannot generate the route samples"
              exit 1
            fi
          done
          out=example/integration_test/route_samples
          common="-nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=30:duration=4"
          ffmpeg $common -c:v libx264 -pix_fmt yuv420p -g 30 \
            -movflags +faststart "$out/h264-8bit.mp4"
          ffmpeg $common -c:v libx265 -pix_fmt yuv420p -g 30 -tag:v hvc1 \
            -x265-params log-level=error "$out/hevc-8bit.mp4"
          ffmpeg $common -c:v libx265 -pix_fmt yuv420p10le -profile:v main10 \
            -g 30 -tag:v hvc1 -x265-params log-level=error "$out/hevc-10bit.mp4"
          check() { # name expected-codec expected-pix_fmt
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,pix_fmt -of default=nw=1 \
              "$out/$1" > "$RUNNER_TEMP/probe-$1.txt"
            codec=$(sed -n 's/^codec_name=//p' "$RUNNER_TEMP/probe-$1.txt")
            pix=$(sed -n 's/^pix_fmt=//p' "$RUNNER_TEMP/probe-$1.txt")
            bytes=$(wc -c < "$out/$1" | tr -d ' ')
            echo "ROUTE-SAMPLES name=$1 codec=$codec pix_fmt=$pix bytes=$bytes"
            if [ "$codec" != "$2" ] || [ "$pix" != "$3" ]; then
              echo "$1: unexpected codec/pix_fmt"
              exit 1
            fi
            if [ "$bytes" -gt 1048576 ]; then
              echo "$1: larger than 1 MiB"
              exit 1
            fi
          }
          check h264-8bit.mp4 h264 yuv420p
          check hevc-8bit.mp4 hevc yuv420p
          check hevc-10bit.mp4 hevc yuv420p10le
      - name: Probe unit tests
        shell: bash
        working-directory: example
        run: flutter test test/macos_route_probe_test.dart
      - name: Parity self-test
        # Runs before the comparison so a broken verdict script cannot
        # produce a verdict.
        shell: bash
        run: python3 tools/check_route_probe.py --self-test
      - name: Frame probe patch matches HEAD
        # The patch is the diagnostic method only. Reverse-applying it to HEAD
        # proves HEAD's plugin contains exactly this patch, so the
        # pre-Phase-12 tree below gets the same second channel and nothing
        # else.
        shell: bash
        run: git apply --reverse --check tools/macos_frame_probe.patch
      - name: Route probe (HEAD plugin)
        # `flutter test -d macos` builds the example, which makes the
        # mpv_kit_libs hook download the pinned bundle. No libmpv path
        # override is set on purpose: the bundle inside the app is measured.
        shell: bash
        working-directory: example
        run: |
          flutter test integration_test/macos_route_test.dart -d macos \
            --dart-define=MPV_KIT_ROUTE_TREE=head \
            --dart-define=MPV_KIT_ROUTE_SECTIONS=pixel,hwdec \
            | tee "$RUNNER_TEMP/route-head.log"
      - name: Route probe (pre-Phase-12 plugin)
        # Same runner, same Flutter SDK, same bundle tag, same test file:
        # only the plugin tree differs.
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/pre12" "$PRE12_SHA"
          actual=$(git -C "$RUNNER_TEMP/pre12" rev-parse HEAD)
          if [ "$actual" != "$PRE12_SHA" ]; then
            echo "pre12 worktree is at $actual, expected $PRE12_SHA"
            exit 1
          fi
          cp example/integration_test/macos_route_test.dart \
             example/integration_test/macos_route_probe.dart \
             "$RUNNER_TEMP/pre12/example/integration_test/"
          # The only change to the old plugin: the diagnostic frame probe.
          git -C "$RUNNER_TEMP/pre12" apply "$GITHUB_WORKSPACE/tools/macos_frame_probe.patch"
          cd "$RUNNER_TEMP/pre12"
          flutter pub get
          cd example
          flutter test integration_test/macos_route_test.dart -d macos \
            --dart-define=MPV_KIT_ROUTE_TREE=pre12 \
            --dart-define=MPV_KIT_ROUTE_SECTIONS=pixel \
            | tee "$RUNNER_TEMP/route-pre12.log"
      - name: Pixel parity
        shell: bash
        run: |
          python3 tools/check_route_probe.py \
            "$RUNNER_TEMP/route-head.log" "$RUNNER_TEMP/route-pre12.log"
