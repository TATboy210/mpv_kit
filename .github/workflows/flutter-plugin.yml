# Build tier for the Flutter plugin: compiles mpv_kit_video's native code
# (with Flutter's -Werror / /WX settings) through the example app, and runs
# analyzer + widget tests. libmpv is loaded at runtime, so it is not needed
# to build.
name: flutter-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
          - runner: windows-2025
            target: windows
          - runner: macos-15
            target: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Locate the hook-bundle libmpv
        # The mpv_kit_libs build hook downloaded the pinned bundle during
        # pub get; point the tests at it so the channel tests run for real
        # instead of silently skipping (ROADMAP phase-6 criterion 3).
        shell: bash
        run: |
          lib=$(find .dart_tool/hooks_runner/shared/mpv_kit_libs/build             \( -name 'libmpv-2.dll' -o -name 'libmpv.so.2' -o -name 'libmpv.2.dylib' \)             | head -1)
          if [ -z "$lib" ]; then echo "no hook bundle found"; exit 1; fi
          dir=$(cd "$(dirname "$lib")" && pwd)
          # Forward slashes load fine on every OS; the dir also goes on PATH
          # so Windows resolves the dependency DLLs (README: local libmpv).
          echo "MPV_KIT_LIBMPV_PATH=$dir/$(basename "$lib")" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          echo "MPV_KIT_REQUIRE_LIBMPV=1" >> "$GITHUB_ENV"
      - name: Analyze plugin and example
        # PATH already carries the hook-bundle dir (previous step); with
        # MPV_KIT_REQUIRE_LIBMPV=1 the channel tests run for real.
        run: |
          cd packages/mpv_kit_video && flutter analyze --fatal-infos && flutter test
          cd ../../example && flutter analyze --fatal-infos
      - name: Build example (${{ matrix.target }})
        working-directory: example
        run: flutter build ${{ matrix.target }} --debug
