# Release tier: redistributable LGPL libmpv for every target.
#
# native/build/build.sh builds everything from pinned, sha256-verified
# sources: the dependencies (deps.sh, cached per target), an LGPL FFmpeg
# (ffmpeg.sh, license gate) and the patched mpv with an explicit feature
# set. Nothing optional comes from the runner's package manager, so the
# bundles run on more than the build machine:
#   * Linux bundles are built in Ubuntu 22.04 (glibc 2.35 baseline);
#   * macOS bundles target macOS 12;
#   * Windows bundles need Windows 10+ (UCRT).
# The bundle is audited (no GPL libraries, FFmpeg resolved from our prefix,
# exported ABI, minimum OS) and the packaged copy itself is tested with the
# build prefix hidden before upload. Pushing a v* tag publishes the bundles
# to a GitHub Release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    # The glibc/libstdc++ the bundle needs is the build distro's: 22.04.
    container: ubuntu:22.04
    steps:
      - name: Install toolchain (no distro FFmpeg, libplacebo or libass)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-pip python3-jinja2 ninja-build \
            nasm curl ca-certificates xz-utils git patchelf binutils \
            libssl-dev libva-dev libdrm-dev libasound2-dev libpulse-dev \
            libfontconfig-dev zlib1g-dev mesa-vulkan-drivers libvulkan1 \
            ffmpeg unzip hwdata
          pip3 install 'meson==1.9.1' 'cmake==3.31.6'
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      - name: render_vk smoke test (lavapipe)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib
        run: |
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          nm -D --defined-only dist/libmpv-${{ matrix.target }}/lib/libmpv.so.2 \
            | awk '{print $3}' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }}
      - name: Test the packaged bundle (build prefix hidden)
        run: |
          mv prefix prefix.hidden
          LD_LIBRARY_PATH="$PWD/dist/libmpv-${{ matrix.target }}/lib" ./tests-out/render_vk_smoke || [ $? -eq 77 ]
          mv prefix.hidden prefix
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests and format matrix on the packaged bundle
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/dist/libmpv-${{ matrix.target }}/lib/libmpv.so.2
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}/samples
        run: |
          bash tools/make_format_samples.sh samples
          sed -i.bak -e "/mpv_kit_video/d" -e "/mpv_kit_libs/d" -e "/example/d" pubspec.yaml
          rm -rf example packages/mpv_kit_video packages/mpv_kit_libs
          # The smoke step may have stopped with the prefix still hidden.
          [ -d prefix ] && mv prefix prefix.hidden
          dart pub get
          cd packages/mpv_kit
          dart test -x format -x devices
          dart test -j 1 -r expanded test/format_matrix_test.dart
          # Runners have no audio endpoint; enumeration there is diagnostic.
          dart test -r expanded test/audio_devices_test.dart || echo "::warning::audio device enumeration failed on this runner"
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (build tools only)
        run: |
          brew install ninja pkgconf nasm cmake dylibbundler
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install 'meson==1.9.1' jinja2
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      - name: render_vk smoke test (MoltenVK; skipped without Metal)
        # See native-verify.yml: MoltenVK aborts on GitHub's Intel VMs.
        continue-on-error: ${{ matrix.runner == 'macos-15-intel' }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib
        run: |
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          nm -gU dist/libmpv-${{ matrix.target }}/lib/libmpv.2.dylib \
            | awk '{print $3}' | sed 's/^_//' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }} 12.0
      - name: Test the packaged bundle (build prefix hidden)
        continue-on-error: ${{ matrix.runner == 'macos-15-intel' }}
        run: |
          mv prefix prefix.hidden
          DYLD_LIBRARY_PATH="$PWD/dist/libmpv-${{ matrix.target }}/lib" ./tests-out/render_vk_smoke || [ $? -eq 77 ]
          mv prefix.hidden prefix
      - name: Install ffmpeg CLI (sample generation only)
        run: brew install ffmpeg
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests and format matrix on the packaged bundle
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/dist/libmpv-${{ matrix.target }}/lib/libmpv.2.dylib
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}/samples
        run: |
          bash tools/make_format_samples.sh samples
          sed -i.bak -e "/mpv_kit_video/d" -e "/mpv_kit_libs/d" -e "/example/d" pubspec.yaml
          rm -rf example packages/mpv_kit_video packages/mpv_kit_libs
          # The smoke step may have stopped with the prefix still hidden.
          [ -d prefix ] && mv prefix prefix.hidden
          dart pub get
          cd packages/mpv_kit
          dart test -x format -x devices
          dart test -j 1 -r expanded test/format_matrix_test.dart
          # Runners have no audio endpoint; enumeration there is diagnostic.
          dart test -r expanded test/audio_devices_test.dart || echo "::warning::audio device enumeration failed on this runner"
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            msystem: CLANG64
            target: windows-x64
            nasm: 'nasm:p'
          - runner: windows-11-arm
            msystem: CLANGARM64
            target: windows-arm64
            nasm: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make diffutils
          pacboy: >-
            toolchain:p meson:p ninja:p cmake:p pkgconf:p python-jinja:p
            vulkan-loader:p libiconv:p ntldd:p ${{ matrix.nasm }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }}
      - name: Format samples (MSYS2 ffmpeg CLI, after packaging)
        run: |
          for i in 1 2 3; do pacman -S --noconfirm --needed "${MINGW_PACKAGE_PREFIX}-ffmpeg" && break; sleep 20; done
          bash tools/make_format_samples.sh samples
      - uses: dart-lang/setup-dart@v1
      - name: Test the packaged bundle (MSYS2 hidden)
        shell: pwsh
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}\dist\libmpv-${{ matrix.target }}\lib\libmpv-2.dll
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}\samples
        run: |
          # Dart-only workspace (no Flutter SDK here).
          (Get-Content pubspec.yaml) | Where-Object { $_ -notmatch 'mpv_kit_video|mpv_kit_libs|example' } | Set-Content pubspec.yaml
          Remove-Item -Recurse -Force example, packages/mpv_kit_video, packages/mpv_kit_libs
          dart pub get
          # Only the bundle, Windows and Dart on PATH: every libmpv
          # dependency must come from the bundle.
          $dart = Split-Path (Get-Command dart).Source
          $env:PATH = "${{ github.workspace }}\dist\libmpv-${{ matrix.target }}\lib;C:\Windows\system32;C:\Windows;$dart"
          cd packages/mpv_kit
          dart test -x format -x devices
          dart test -j 1 -r expanded test/format_matrix_test.dart
          # Runners have no audio endpoint; enumeration there is diagnostic.
          dart test -r expanded test/audio_devices_test.dart
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::audio device enumeration failed on this runner" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archive bundles
        run: |
          mkdir release
          for d in artifacts/libmpv-*; do
            name=$(basename "$d")
            tar -C "$d" -czf "release/$name.tar.gz" .
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "LGPL libmpv (mpv 0.41.0 + Vulkan render patch, FFmpeg 8.1.3) for mpv_kit. Verify downloads against SHA256SUMS."
