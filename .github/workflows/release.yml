# Release tier: redistributable LGPL libmpv for every target.
#
# native/build/build.sh builds everything from pinned, sha256-verified
# sources: the dependencies (deps.sh, cached per target), an LGPL FFmpeg
# (ffmpeg.sh, license gate) and the patched mpv with an explicit feature
# set. Nothing optional comes from the runner's package manager, so the
# bundles run on more than the build machine:
#   * Linux bundles are built in Ubuntu 22.04 (glibc 2.35 baseline);
#   * macOS bundles target macOS 12;
#   * Windows bundles need Windows 10+ (UCRT).
# The bundle is audited (no GPL libraries, FFmpeg resolved from our prefix,
# exported ABI, minimum OS) and the packaged copy itself is tested with the
# build prefix hidden before upload. Pushing a v* tag publishes the bundles
# to a GitHub Release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    # The glibc/libstdc++ the bundle needs is the build distro's: 22.04.
    container: ubuntu:22.04
    steps:
      - name: Install toolchain (no distro FFmpeg, libplacebo or libass)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-pip python3-jinja2 ninja-build \
            nasm curl ca-certificates xz-utils git patch patchelf binutils \
            libssl-dev libva-dev libdrm-dev libasound2-dev libpulse-dev \
            libfontconfig-dev zlib1g-dev mesa-vulkan-drivers libvulkan1 \
            ffmpeg unzip hwdata
          pip3 install 'meson==1.9.1' 'cmake==3.31.6'
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh', 'native/deps/libplacebo/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      # The container's libdrm (2.4.113) is the runtime floor of the Linux
      # bundle. This guard catches a vendored mpv that needs newer libdrm
      # symbols; native-verify runs on ubuntu-24.04 (newer libdrm) and cannot.
      - name: libmpv resolves against the container libdrm (2.4.113 floor)
        shell: bash
        run: |
          libdrm_ver=$(pkg-config --modversion libdrm)
          echo "container libdrm: $libdrm_ver"

          # A libdrm copy in the prefix would mask the host's symbols.
          if [ -n "$(find prefix/lib -maxdepth 1 -name 'libdrm*')" ]; then
            echo "LIBDRM-FLOOR FAIL: prefix/lib contains a libdrm copy:" >&2
            find prefix/lib -maxdepth 1 -name 'libdrm*' >&2
            exit 1
          fi

          ldd_rc=0
          ldd_out=$(LD_LIBRARY_PATH="$PWD/prefix/lib" ldd -r prefix/lib/libmpv.so.2 2>&1) || ldd_rc=$?
          echo "ldd -r exit code: $ldd_rc"
          printf '%s\n' "$ldd_out"

          bad=$(printf '%s\n' "$ldd_out" | grep 'undefined symbol: drm' || true)
          if [ -n "$bad" ]; then
            echo "LIBDRM-FLOOR FAIL: libmpv needs libdrm symbols the container libdrm lacks:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

          drm_line=$(printf '%s\n' "$ldd_out" | grep -E '^[[:space:]]*libdrm\.so\.2 => ' || true)
          if [ -z "$drm_line" ]; then
            echo "LIBDRM-FLOOR FAIL: ldd -r shows no 'libdrm.so.2 =>' line" >&2
            exit 1
          fi
          drm_path=$(printf '%s\n' "$drm_line" | awk '{print $3}')
          case "$drm_path" in
            "$PWD"/prefix/*|"")
              echo "LIBDRM-FLOOR FAIL: libdrm.so.2 resolved inside prefix/: '$drm_path'" >&2
              exit 1 ;;
            /*) echo "libdrm.so.2 resolved to $drm_path" ;;
            *)
              echo "LIBDRM-FLOOR FAIL: libdrm.so.2 did not resolve: '$drm_path'" >&2
              exit 1 ;;
          esac

          # Imported drm* names, for the log; the three 2.4.114-only helpers must be absent.
          drm_syms=$(nm -D --undefined-only prefix/lib/libmpv.so.2 | awk '$1 == "U" {print $2}' | sed 's/@.*//' | grep '^drm' | sort -u || true)
          echo "libmpv imports (drm*):"
          printf '%s\n' "$drm_syms"
          new_syms=$(printf '%s\n' "$drm_syms" | grep -x -e drmModeCreateDumbBuffer -e drmModeDestroyDumbBuffer -e drmModeMapDumbBuffer || true)
          if [ -n "$new_syms" ]; then
            echo "LIBDRM-FLOOR FAIL: libmpv imports libdrm 2.4.114-only helpers:" >&2
            printf '%s\n' "$new_syms" >&2
            exit 1
          fi

          # Binding flags for the log (decides eager vs lazy failure on old hosts).
          dyn=$(readelf -d prefix/lib/libmpv.so.2)
          printf '%s\n' "$dyn" | grep -E 'NEEDED|FLAGS|BIND_NOW' || true
          for lib in 'libdrm\.so\.2' 'libva-drm\.so\.2'; do
            if ! printf '%s\n' "$dyn" | grep -Eq "\(NEEDED\).*\[$lib\]"; then
              echo "LIBDRM-FLOOR FAIL: NEEDED lacks $lib" >&2
              exit 1
            fi
          done

          for flag in HAVE_DRM HAVE_VAAPI_DRM; do
            if ! grep -Eq "^#define $flag 1[[:space:]]*$" .mpv-build/config.h; then
              echo "LIBDRM-FLOOR FAIL: .mpv-build/config.h lacks '#define $flag 1'" >&2
              exit 1
            fi
          done

          echo "LIBDRM-FLOOR OK libdrm=$libdrm_ver undefined_drm=0"
      - name: render_vk smoke test (lavapipe)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib
        run: |
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          nm -D --defined-only dist/libmpv-${{ matrix.target }}/lib/libmpv.so.2 \
            | awk '{print $3}' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }}
      - name: Test the packaged bundle (build prefix hidden)
        run: |
          mv prefix prefix.hidden
          LD_LIBRARY_PATH="$PWD/dist/libmpv-${{ matrix.target }}/lib" ./tests-out/render_vk_smoke || [ $? -eq 77 ]
          mv prefix.hidden prefix
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests and format matrix on the packaged bundle
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/dist/libmpv-${{ matrix.target }}/lib/libmpv.so.2
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}/samples
        run: |
          bash tools/make_format_samples.sh samples
          sed -i.bak -e "/mpv_kit_video/d" -e "/mpv_kit_libs/d" -e "/example/d" pubspec.yaml
          rm -rf example packages/mpv_kit_video packages/mpv_kit_libs
          # The smoke step may have stopped with the prefix still hidden.
          [ -d prefix ] && mv prefix prefix.hidden
          dart pub get
          cd packages/mpv_kit
          dart test -x format
          dart test -j 1 -r expanded test/format_matrix_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (build tools only)
        run: |
          brew install ninja pkgconf nasm cmake dylibbundler gpatch
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install 'meson==1.9.1' jinja2
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh', 'native/deps/libplacebo/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      - name: render_vk smoke test (MoltenVK; skipped without Metal)
        # Environment limitation, made explicit (see native-verify.yml):
        # MoltenVK aborts on GitHub's Intel VMs; real Intel Macs are
        # unaffected. Conditional skip is visible; arm64 runs strictly.
        if: matrix.runner != 'macos-15-intel'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/prefix/lib/pkgconfig
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/prefix/lib
        run: |
          meson setup tests-out native/tests
          meson test -C tests-out --print-errorlogs
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          nm -gU dist/libmpv-${{ matrix.target }}/lib/libmpv.2.dylib \
            | awk '{print $3}' | sed 's/^_//' | grep '^mpv_' | sort -u > exported.txt
          diff tools/rea_abi_audit/expected_symbols.txt exported.txt
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }} 12.0
      - name: Test the packaged bundle (build prefix hidden)
        # Same Intel-VM environment limitation as the smoke step above.
        if: matrix.runner != 'macos-15-intel'
        run: |
          mv prefix prefix.hidden
          DYLD_LIBRARY_PATH="$PWD/dist/libmpv-${{ matrix.target }}/lib" ./tests-out/render_vk_smoke || [ $? -eq 77 ]
          mv prefix.hidden prefix
      - name: Install ffmpeg CLI (sample generation only)
        run: brew install ffmpeg
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests and format matrix on the packaged bundle
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}/dist/libmpv-${{ matrix.target }}/lib/libmpv.2.dylib
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}/samples
        run: |
          bash tools/make_format_samples.sh samples
          sed -i.bak -e "/mpv_kit_video/d" -e "/mpv_kit_libs/d" -e "/example/d" pubspec.yaml
          rm -rf example packages/mpv_kit_video packages/mpv_kit_libs
          # The smoke step may have stopped with the prefix still hidden.
          [ -d prefix ] && mv prefix prefix.hidden
          dart pub get
          cd packages/mpv_kit
          dart test -x format
          dart test -j 1 -r expanded test/format_matrix_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            msystem: CLANG64
            target: windows-x64
            nasm: 'nasm:p'
          - runner: windows-11-arm
            msystem: CLANGARM64
            target: windows-arm64
            nasm: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make diffutils patch
          pacboy: >-
            toolchain:p meson:p ninja:p cmake:p pkgconf:p python-jinja:p
            vulkan-loader:p libiconv:p ntldd:p ${{ matrix.nasm }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('native/build/deps.sh', 'native/deps/libplacebo/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash native/build/deps.sh "$PWD/deps"
      - name: Build FFmpeg and libmpv
        run: |
          cp -a deps prefix
          SKIP_DEPS=1 bash native/build/build.sh "$PWD/prefix"
      - name: Package and audit
        run: |
          bash native/build/package.sh prefix dist/libmpv-${{ matrix.target }}
          bash tools/bundle_report.sh dist/libmpv-${{ matrix.target }}
      - name: Format samples (MSYS2 ffmpeg CLI, after packaging)
        run: |
          for i in 1 2 3; do pacman -S --noconfirm --needed "${MINGW_PACKAGE_PREFIX}-ffmpeg" && break; sleep 20; done
          bash tools/make_format_samples.sh samples
      - uses: dart-lang/setup-dart@v1
      - name: Test the packaged bundle (MSYS2 hidden)
        shell: pwsh
        env:
          MPV_KIT_LIBMPV_PATH: ${{ github.workspace }}\dist\libmpv-${{ matrix.target }}\lib\libmpv-2.dll
          MPV_KIT_FORMAT_SAMPLES: ${{ github.workspace }}\samples
        run: |
          # Dart-only workspace (no Flutter SDK here).
          (Get-Content pubspec.yaml) | Where-Object { $_ -notmatch 'mpv_kit_video|mpv_kit_libs|example' } | Set-Content pubspec.yaml
          Remove-Item -Recurse -Force example, packages/mpv_kit_video, packages/mpv_kit_libs
          dart pub get
          # Only the bundle, Windows and Dart on PATH: every libmpv
          # dependency must come from the bundle.
          $dart = Split-Path (Get-Command dart).Source
          $env:PATH = "${{ github.workspace }}\dist\libmpv-${{ matrix.target }}\lib;C:\Windows\system32;C:\Windows;$dart"
          cd packages/mpv_kit
          dart test -x format
          dart test -j 1 -r expanded test/format_matrix_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.target }}
          path: dist/libmpv-${{ matrix.target }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archive and verify bundles
        run: |
          mkdir release
          for d in artifacts/libmpv-*; do
            name=$(basename "$d")
            tar -C "$d" -czf "release/$name.tar.gz" .
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS
          # Self-verification before publishing: every tar matches its
          # SHA256SUMS line, and every tar carries a MANIFEST.txt whose
          # per-file hashes verify against the archived contents.
          for t in release/*.tar.gz; do
            grep -F "$(sha256sum "$t" | cut -d' ' -f1)" release/SHA256SUMS               > /dev/null || { echo "$t: not in SHA256SUMS"; exit 1; }
            rm -rf verify && mkdir verify
            tar -C verify -xzf "$t"
            test -f verify/MANIFEST.txt || { echo "$t: no MANIFEST.txt"; exit 1; }
            (cd verify && sha256sum -c MANIFEST.txt)               || { echo "$t: MANIFEST mismatch"; exit 1; }
            rm -rf verify
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "LGPL libmpv (mpv 0.41.0 + Vulkan render patch, FFmpeg 8.1.3) for mpv_kit. Verify downloads against SHA256SUMS."
