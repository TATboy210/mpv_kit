name: mpv_kit_libs
description: >-
  Prebuilt LGPL libmpv (mpv 0.41 with the mpv_kit Vulkan render patch,
  FFmpeg 8.1) for mpv_kit, delivered through a Dart build hook with sha256
  verification. Windows, Linux and macOS on x64 and arm64.
version: 0.1.0-dev.2
repository: https://github.com/TATboy210/mpv_kit
issue_tracker: https://github.com/TATboy210/mpv_kit/issues
topics: [mpv, video, ffi, native-assets]
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.6
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
