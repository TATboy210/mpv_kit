include: package:lints/recommended.yaml

analyzer:
  # `dart:mirrors` is VM-only and the local Flutter workspace cannot resolve
  # it; this test is excluded from static analysis here but still compiles and
  # runs under `dart test`, so a real compile error still fails.
  exclude:
    - test/api_freeze_test.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
