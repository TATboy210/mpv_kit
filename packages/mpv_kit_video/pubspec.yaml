name: mpv_kit_video
description: >-
  Flutter video output for mpv_kit: zero-copy Vulkan rendering into Flutter
  textures (D3D11 shared textures on Windows, GL memory objects on Linux,
  IOSurface on macOS) with a software fallback.
version: 0.1.0-dev.1
repository: https://github.com/TATboy210/mpv_kit
issue_tracker: https://github.com/TATboy210/mpv_kit/issues
topics: [mpv, video, vulkan, player]
resolution: workspace

environment:
  # mpv_kit_libs' build hook needs Dart 3.10 (Flutter 3.38).
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  mpv_kit: ^0.1.0-dev.1
  # Bundles the matching libmpv build into the app. Emits nothing while no
  # release is pinned; MPV_KIT_LIBMPV_PATH / a system libmpv apply then.
  mpv_kit_libs: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MpvKitVideoPluginCApi
      linux:
        pluginClass: MpvKitVideoPlugin
      macos:
        pluginClass: MpvKitVideoPlugin
